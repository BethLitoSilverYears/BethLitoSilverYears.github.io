<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Forbid caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Meta Data for Crawlers -->
    <meta property="og:title" content="Joselito & Lilibeth Wedding" />
    <meta property="og:description" content="We invite you to celebrate our silver wedding." />
    <meta property="og:image" content="https://bethlitosilveryears.github.io/images/invitation.jpg" />
    <meta property="og:image:alt" content="Wedding Couple Photo" />
    <meta property="og:url" content="https://bethlitosilveryears.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="fb:app_id" content="none" />

    <title>Loading...</title>

  </head>

  <body>
    <div id="mainContent" style="display: none;"></div>
    <div id="loadingContent"></div>

    <!-- Load website content/scripts -->
    <script type="text/javascript">
      const contentScript = document.createElement('script');
      contentScript.src = `js/min/loader.min.js?v=${Date.now()}`;
      document.head.appendChild(contentScript);
    </script>

  </body>
</html>
